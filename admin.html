<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎛️ لوحة التحكم</title>
    <style>
        :root {
            --primary: #ff1a5c;
            --secondary: #b300ff;
            --success: #00c853;
            --danger: #ff1744;
            --warning: #ffa726;
            --dark: #0a0a0a;
            --surface: #1a1a2e;
            --border: rgba(255, 26, 92, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
            background: var(--dark);
            color: #fff;
            min-height: 100vh;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: linear-gradient(135deg, rgba(255, 26, 92, 0.15), rgba(179, 0, 255, 0.15));
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffb6c1, #ff4d6d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .header p {
            color: #ccc;
            font-size: 1.1rem;
        }

        .section {
            background: var(--surface);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid var(--border);
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #ffb6c1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #ffccd5;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 2px solid var(--border);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(255, 26, 92, 0.3);
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
        }

        .btn-success {
            background: var(--success);
            color: #fff;
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        .btn-warning {
            background: var(--warning);
            color: #fff;
        }

        .btn-secondary {
            background: #666;
            color: #fff;
        }

        .buttons-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .button-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .button-preview {
            padding: 12px 20px;
            font-size: 1.1rem;
            font-weight: 700;
            text-align: center;
            border-radius: 25px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            cursor: pointer;
        }

        .button-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-active {
            background: rgba(0, 200, 83, 0.2);
            color: var(--success);
        }

        .status-inactive {
            background: rgba(255, 23, 68, 0.2);
            color: var(--danger);
        }

        .button-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-small {
            padding: 8px 15px;
            font-size: 0.85rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            flex: 1;
        }

        .btn-small:hover {
            transform: scale(1.05);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--success);
            color: #fff;
            padding: 15px 30px;
            border-radius: 12px;
            font-weight: 700;
            z-index: 1000;
            display: none;
            animation: slideUp 0.5s;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            .header h1 {
                font-size: 2rem;
            }
            .buttons-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🎛️ لوحة التحكم</h1>
            <p>إدارة الموقع - الخلفية، النصوص، والأزرار</p>
        </div>

        <!-- إعدادات عامة -->
        <div class="section">
            <div class="section-title">⚙️ الإعدادات العامة</div>
            
            <div class="form-group">
                <label>عنوان الموقع</label>
                <input type="text" class="form-input" id="siteTitle" placeholder="أدخل عنوان الموقع">
            </div>
            
            <div class="form-group">
                <label>العنوان الفرعي</label>
                <input type="text" class="form-input" id="siteSubtitle" placeholder="أدخل العنوان الفرعي">
            </div>
        </div>

        <!-- إعدادات الخلفية -->
        <div class="section">
            <div class="section-title">🖼️ الخلفية</div>
            
            <div class="form-group">
                <label>نوع الخلفية</label>
                <select class="form-input" id="backgroundType">
                    <option value="image">صورة</option>
                    <option value="video">فيديو</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>رابط الخلفية</label>
                <input type="text" class="form-input" id="backgroundUrl" placeholder="https://example.com/image.jpg أو video.mp4">
            </div>
            
            <button class="btn btn-primary" onclick="previewBackground()">👁️ معاينة</button>
        </div>

        <!-- إدارة الأزرار -->
        <div class="section">
            <div class="section-title">🔘 الأزرار</div>
            
            <div style="background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; margin-bottom: 20px;">
                <h4 style="margin-bottom: 15px; color: #ffccd5;">➕ إضافة زر جديد</h4>
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; align-items: end;">
                    <div class="form-group" style="margin: 0;">
                        <label>النص</label>
                        <input type="text" class="form-input" id="newBtnText" placeholder="نص الزر">
                    </div>
                    <div class="form-group" style="margin: 0;">
                        <label>الأيقونة</label>
                        <input type="text" class="form-input" id="newBtnIcon" placeholder="🔥">
                    </div>
                    <div class="form-group" style="margin: 0;">
                        <label>الرابط</label>
                        <input type="text" class="form-input" id="newBtnLink" placeholder="https://...">
                    </div>
                    <button class="btn btn-success" onclick="addButton()">إضافة</button>
                </div>
            </div>
            
            <div class="buttons-list" id="buttonsList"></div>
        </div>

        <!-- حفظ -->
        <button class="btn btn-primary" style="width: 100%; padding: 15px; font-size: 1.2rem;" onclick="saveAll()">
            💾 حفظ جميع التغييرات
        </button>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let settings = {
            siteTitle: 'ليالي الرقص',
            siteSubtitle: '🔥 تعارف · دروس خاصة · إيقاع لا يتوقف 🔥',
            backgroundType: 'image',
            backgroundUrl: 'https://images.unsplash.com/photo-1504609773096-104ff2c73ba4?w=1920&q=80'
        };
        
        let buttons = [];
        let editingId = null;

        // تحميل البيانات
        function loadData() {
            try {
                const savedSettings = localStorage.getItem('danceSiteSettings');
                if (savedSettings) {
                    settings = JSON.parse(savedSettings);
                }
            } catch (e) {}
            
            try {
                const savedButtons = localStorage.getItem('danceSiteButtons');
                if (savedButtons) {
                    buttons = JSON.parse(savedButtons);
                } else {
                    buttons = [
                        { id: 1, text: 'انضم للعالم السري', icon: '⬇', link: 'https://enjoysex.top/lp/00004PPC', active: true, clicks: 0 },
                        { id: 2, text: 'راقصات مباشر', icon: '💋', link: 'https://enjoysex.top/lp/00004PPC', active: true, clicks: 0 },
                        { id: 3, text: 'تعلم السالسا', icon: '🎵', link: 'https://enjoysex.top/lp/00004PPC', active: true, clicks: 0 },
                        { id: 4, text: 'ليالي تعارف', icon: '❤️', link: 'https://enjoysex.top/lp/00004PPC', active: true, clicks: 0 },
                        { id: 5, text: 'عروض خاصة', icon: '✨', link: 'https://enjoysex.top/lp/00004PPC', active: true, clicks: 0 }
                    ];
                }
            } catch (e) {
                buttons = [];
            }
            
            // تطبيق على الواجهة
            document.getElementById('siteTitle').value = settings.siteTitle;
            document.getElementById('siteSubtitle').value = settings.siteSubtitle;
            document.getElementById('backgroundType').value = settings.backgroundType;
            document.getElementById('backgroundUrl').value = settings.backgroundUrl;
            
            renderButtons();
        }

        // عرض الأزرار
        function renderButtons() {
            const container = document.getElementById('buttonsList');
            container.innerHTML = '';
            
            buttons.forEach(btn => {
                const card = document.createElement('div');
                card.className = 'button-card';
                
                if (editingId === btn.id) {
                    card.innerHTML = `
                        <div class="form-group" style="margin-bottom: 8px;">
                            <label style="font-size: 0.85rem;">النص</label>
                            <input type="text" class="form-input" id="editText-${btn.id}" value="${btn.text}" style="padding: 8px; font-size: 0.9rem;">
                        </div>
                        <div class="form-group" style="margin-bottom: 8px;">
                            <label style="font-size: 0.85rem;">الأيقونة</label>
                            <input type="text" class="form-input" id="editIcon-${btn.id}" value="${btn.icon || ''}" style="padding: 8px; font-size: 0.9rem;">
                        </div>
                        <div class="form-group" style="margin-bottom: 12px;">
                            <label style="font-size: 0.85rem;">الرابط</label>
                            <input type="text" class="form-input" id="editLink-${btn.id}" value="${btn.link}" style="padding: 8px; font-size: 0.9rem;">
                        </div>
                        <div class="button-actions">
                            <button class="btn-small btn-success" onclick="saveEdit(${btn.id})">💾 حفظ</button>
                            <button class="btn-small btn-secondary" onclick="cancelEdit()">❌ إلغاء</button>
                        </div>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="button-preview">${btn.icon ? btn.icon + ' ' : ''}${btn.text}</div>
                        <div class="button-info">
                            <span style="font-size: 0.85rem; color: #ccc;">👆 ${btn.clicks || 0} نقرة</span>
                            <span class="status-badge ${btn.active ? 'status-active' : 'status-inactive'}">
                                ${btn.active ? 'نشط' : 'معطل'}
                            </span>
                        </div>
                        <div class="button-actions">
                            <button class="btn-small btn-warning" onclick="startEdit(${btn.id})">✏️ تعديل</button>
                            <button class="btn-small btn-secondary" onclick="toggleButton(${btn.id})">
                                ${btn.active ? '⏸️ تعطيل' : '▶️ تفعيل'}
                            </button>
                            <button class="btn-small btn-danger" onclick="deleteButton(${btn.id})">🗑️ حذف</button>
                        </div>
                    `;
                }
                
                container.appendChild(card);
            });
        }

        // إضافة زر
        function addButton() {
            const text = document.getElementById('newBtnText').value.trim();
            const icon = document.getElementById('newBtnIcon').value.trim();
            const link = document.getElementById('newBtnLink').value.trim();
            
            if (!text || !link) {
                showToast('⚠️ الرجاء إدخال النص والرابط');
                return;
            }
            
            buttons.push({
                id: Date.now(),
                text: text,
                icon: icon || '🔥',
                link: link,
                active: true,
                clicks: 0
            });
            
            document.getElementById('newBtnText').value = '';
            document.getElementById('newBtnIcon').value = '';
            document.getElementById('newBtnLink').value = '';
            
            renderButtons();
            showToast('✅ تم إضافة الزر');
        }

        // بدء التعديل
        function startEdit(id) {
            editingId = id;
            renderButtons();
        }

        // حفظ التعديل
        function saveEdit(id) {
            const text = document.getElementById(`editText-${id}`).value.trim();
            const icon = document.getElementById(`editIcon-${id}`).value.trim();
            const link = document.getElementById(`editLink-${id}`).value.trim();
            
            if (!text || !link) {
                showToast('⚠️ الرجاء إدخال النص والرابط');
                return;
            }
            
            const btn = buttons.find(b => b.id === id);
            if (btn) {
                btn.text = text;
                btn.icon = icon || '🔥';
                btn.link = link;
                editingId = null;
                renderButtons();
                showToast('✅ تم حفظ التعديلات');
            }
        }

        // إلغاء التعديل
        function cancelEdit() {
            editingId = null;
            renderButtons();
        }

        // حذف زر
        function deleteButton(id) {
            if (confirm('هل أنت متأكد من الحذف؟')) {
                buttons = buttons.filter(b => b.id !== id);
                renderButtons();
                showToast('🗑️ تم الحذف');
            }
        }

        // تفعيل/تعطيل
        function toggleButton(id) {
            const btn = buttons.find(b => b.id === id);
            if (btn) {
                btn.active = !btn.active;
                renderButtons();
                showToast(btn.active ? '✅ تم التفعيل' : '⏸️ تم التعطيل');
            }
        }

        // معاينة الخلفية
        function previewBackground() {
            settings.backgroundType = document.getElementById('backgroundType').value;
            settings.backgroundUrl = document.getElementById('backgroundUrl').value.trim();
            window.open('index.html', '_blank');
        }

        // حفظ الكل
        function saveAll() {
            settings.siteTitle = document.getElementById('siteTitle').value.trim() || 'ليالي الرقص';
            settings.siteSubtitle = document.getElementById('siteSubtitle').value.trim() || '🔥 تعارف · دروس خاصة · إيقاع لا يتوقف 🔥';
            settings.backgroundType = document.getElementById('backgroundType').value;
            settings.backgroundUrl = document.getElementById('backgroundUrl').value.trim();
            
            localStorage.setItem('danceSiteSettings', JSON.stringify(settings));
            localStorage.setItem('danceSiteButtons', JSON.stringify(buttons));
            
            showToast('✅ تم حفظ جميع التغييرات بنجاح');
        }

        // رسالة
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        // تهيئة
        loadData();
    </script>
</body>
</html>
