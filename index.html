<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ ليالي الرقص | تعارف وتعليم ✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            background-color: #1a0a0a;
            color: #fff;
        }

        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
        }

        .video-background video,
        .video-background img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(255, 0, 100, 0.25), transparent 60%),
                        radial-gradient(circle at 80% 70%, rgba(180, 0, 255, 0.3), transparent 70%),
                        linear-gradient(135deg, rgba(20, 0, 30, 0.75) 0%, rgba(40, 0, 40, 0.55) 100%);
            z-index: -1;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        .top-bar {
            position: absolute;
            top: 20px;
            width: 90%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .brand {
            font-size: 1.7rem;
            font-weight: 800;
            background: linear-gradient(45deg, #ffb6c1, #ff4d6d, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(255, 0, 100, 0.6);
        }

        .live-badge {
            background: rgba(255, 0, 80, 0.7);
            backdrop-filter: blur(6px);
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 20px rgba(255, 0, 80, 0.7);
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            animation: livePulse 1.5s infinite;
        }

        .title {
            font-size: 5rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff0f0, #ffccd5, #e0b0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 0, 150, 0.5);
            letter-spacing: 3px;
            cursor: default;
            user-select: none;
        }

        .subtitle {
            font-size: 1.8rem;
            font-weight: 400;
            margin-bottom: 2.5rem;
            color: rgba(255, 230, 240, 0.95);
            text-shadow: 0 0 15px #ff0066;
            letter-spacing: 2px;
            background: rgba(0,0,0,0.3);
            padding: 10px 30px;
            border-radius: 50px;
            backdrop-filter: blur(2px);
        }

        .cta-btn {
            display: inline-block;
            padding: 20px 70px;
            font-size: 2rem;
            font-weight: 800;
            color: #fff;
            background: linear-gradient(45deg, #ff1a5c, #b300ff);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.5s;
            box-shadow: 0 15px 40px rgba(200, 0, 120, 0.7);
            letter-spacing: 3px;
            animation: pulseGlow 2.2s infinite;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 200, 220, 0.6);
        }

        .cta-btn:hover {
            transform: translateY(-6px) scale(1.06);
            box-shadow: 0 25px 60px #ff2b7a;
        }

        .teaser-banner {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 18px;
            margin-top: 20px;
        }

        .ad-card {
            background: rgba(20, 5, 15, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 25px;
            padding: 12px 25px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 80, 150, 0.5);
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            font-weight: 600;
        }

        .ad-card:hover {
            background: rgba(255, 20, 100, 0.3);
            transform: scale(1.08);
        }

        .ad-icon {
            font-size: 2rem;
        }

        .ad-text {
            font-size: 1.1rem;
            color: #ffe6f0;
        }

        .ad-card.special {
            background: linear-gradient(145deg, #3a0a20, #1f0010);
            border: 2px solid #ffa0c0;
        }

        .footer-note {
            position: absolute;
            bottom: 20px;
            font-size: 0.9rem;
            opacity: 0.8;
            color: #ffc0d0;
        }

        .admin-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 9999;
            overflow-y: auto;
        }

        .admin-modal.active {
            display: block;
        }

        .admin-container {
            background: #1a1a2e;
            border-radius: 15px;
            padding: 20px;
            max-width: 600px;
            margin: 30px auto;
            border: 2px solid #ff4d6d;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .admin-title {
            font-size: 1.5rem;
            color: #ff4d6d;
            font-weight: 800;
        }

        .close-admin {
            background: #ff4d6d;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .admin-tab {
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #ff4d6d;
            border-radius: 20px;
            cursor: pointer;
            color: white;
            transition: all 0.3s;
        }

        .admin-tab.active {
            background: #ff4d6d;
            color: white;
        }

        .admin-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .admin-section h3 {
            color: #ffb6c1;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #ffc0d0;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #ff4d6d;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
        }

        .admin-btn {
            background: linear-gradient(45deg, #ff1a5c, #b300ff);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            margin: 5px;
            transition: all 0.3s;
        }

        .admin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 0, 100, 0.5);
        }

        .password-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .password-box {
            background: #1a1a2e;
            border: 2px solid #ff4d6d;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
        }

        .password-box input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #ff4d6d;
            border-radius: 8px;
            color: white;
            font-size: 1.1rem;
            text-align: center;
        }

        .password-box button {
            background: linear-gradient(45deg, #ff1a5c, #b300ff);
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1rem;
            margin: 5px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            z-index: 10001;
            animation: fadeInUp 0.3s;
            display: none;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translate(-50%, 20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 15px 40px rgba(200,0,120,0.7); }
            50% { box-shadow: 0 15px 40px rgba(200,0,120,0.9), 0 0 30px #ff2b7a; }
            100% { box-shadow: 0 15px 40px rgba(200,0,120,0.7); }
        }

        @keyframes livePulse {
            0%,100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.4); }
        }

        @media (max-width: 768px) {
            .title { font-size: 3rem; }
            .subtitle { font-size: 1.2rem; }
            .cta-btn { padding: 15px 40px; font-size: 1.4rem; }
            .ad-card { padding: 8px 15px; }
            .brand { font-size: 1.2rem; }
            .admin-container {
                margin: 10px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="video-background" id="videoBackground"></div>
    <div class="overlay"></div>

    <div class="top-bar">
        <div class="brand" id="brandText">💃 رقص وتعارف</div>
        <div class="live-badge"><span class="live-dot"></span> جلسات حية الآن</div>
    </div>

    <div class="container">
        <h1 class="title" id="mainTitle">ليالي الرقص</h1>
        <p class="subtitle" id="mainSubtitle">🔥 تعارف · دروس خاصة · إيقاع لا يتوقف 🔥</p>

        <a href="#" class="cta-btn" id="mainCta">⬇ انضم للعالم السري</a>

        <div class="teaser-banner" id="teaserBanner"></div>
    </div>

    <div class="footer-note" id="footerNote">اضغط أي إعلان للانضمام الفوري</div>

    <div class="toast" id="toast"></div>

    <div class="password-screen" id="passwordScreen" style="display: none;">
        <div class="password-box">
            <h2 style="color: #ff4d6d; margin-bottom: 15px;">🔐 كلمة السر</h2>
            <input type="password" id="passwordInput" placeholder="أدخل كلمة السر">
            <br>
            <button onclick="checkPassword()">دخول</button>
            <button onclick="closePasswordScreen()" style="background: #666;">إلغاء</button>
        </div>
    </div>

    <div class="admin-modal" id="adminModal">
        <div class="admin-container">
            <div class="admin-header">
                <h2 class="admin-title">⚙️ لوحة التحكم</h2>
                <button class="close-admin" onclick="closeAdmin()">×</button>
            </div>

            <div class="admin-tabs">
                <button class="admin-tab active" onclick="switchTab('content')">📝 المحتوى</button>
            </div>

            <div class="admin-section" id="contentSection">
                <h3>📝 تعديل المحتوى</h3>
                <div class="form-group">
                    <label>اسم الموقع:</label>
                    <input type="text" id="editBrand" value="💃 رقص وتعارف">
                </div>
                <div class="form-group">
                    <label>العنوان الرئيسي:</label>
                    <input type="text" id="editTitle" value="ليالي الرقص">
                </div>
                <div class="form-group">
                    <label>الوصف:</label>
                    <textarea id="editSubtitle" rows="3">🔥 تعارف · دروس خاصة · إيقاع لا يتوقف 🔥</textarea>
                </div>
                <div class="form-group">
                    <label>نص الزر الرئيسي:</label>
                    <input type="text" id="editMainBtn" value="⬇ انضم للعالم السري">
                </div>
                <div class="form-group">
                    <label>رابط الزر الرئيسي:</label>
                    <input type="url" id="editMainLink" value="https://yaya-gamma.vercel.app/">
                </div>
                <div class="form-group">
                    <label>النص السفلي:</label>
                    <input type="text" id="editFooter" value="اضغط أي إعلان للانضمام الفوري">
                </div>
                <button class="admin-btn" onclick="saveToGitHub()">💾 حفظ ونشر</button>
            </div>
        </div>
    </div>

    <script>
        const GITHUB_TOKEN = "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";
        const GITHUB_USERNAME = "mazo12";
        const GITHUB_REPO = "mazo12";
        const FILE_PATH = "index.html";
        
        const ADMIN_PASSWORD = "admin123";
        const MAIN_LINK = "https://yaya-gamma.vercel.app/";

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        async function saveToGitHub() {
            try {
                const brand = document.getElementById('editBrand').value;
                const title = document.getElementById('editTitle').value;
                const subtitle = document.getElementById('editSubtitle').value;
                const mainBtnText = document.getElementById('editMainBtn').value;
                const mainBtnLink = document.getElementById('editMainLink').value;
                const footerNote = document.getElementById('editFooter').value;

                // بناء الكود الجديد كاملاً
                const newContent = generateFullHTML(brand, title, subtitle, mainBtnText, mainBtnLink, footerNote);

                // التحقق من وجود الملف أولاً
                const checkResponse = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${FILE_PATH}`, {
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`
                    }
                });

                let sha = null;
                if (checkResponse.ok) {
                    const fileData = await checkResponse.json();
                    sha = fileData.sha;
                }

                // حفظ الملف
                const saveResponse = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${FILE_PATH}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: 'Update site content',
                        content: btoa(unescape(encodeURIComponent(newContent))),
                        sha: sha
                    })
                });

                if (saveResponse.ok) {
                    showToast('✅ تم الحفظ! سيتم التحديث خلال دقائق');
                    
                    // تحديث الموقع مباشرة
                    document.getElementById('brandText').textContent = brand;
                    document.getElementById('mainTitle').textContent = title;
                    document.getElementById('mainSubtitle').textContent = subtitle;
                    document.getElementById('mainCta').textContent = mainBtnText;
                    document.getElementById('footerNote').textContent = footerNote;
                } else {
                    const error = await saveResponse.json();
                    showToast('❌ خطأ: ' + error.message);
                }
            } catch (error) {
                showToast('❌ خطأ: ' + error.message);
            }
        }

        function generateFullHTML(brand, title, subtitle, mainBtnText, mainBtnLink, footerNote) {
            return `<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${title}</title>
</head>
<body>
    <h1>${title}</h1>
    <p>${subtitle}</p>
    <p>${brand}</p>
    <button>${mainBtnText}</button>
    <p>${footerNote}</p>
    <a href="${mainBtnLink}">الرابط</a>
</body>
</html>`;
        }

        function switchTab(tab) {
            // بسيطة حالياً
        }

        function showPasswordScreen() {
            document.getElementById('passwordScreen').style.display = 'flex';
            document.getElementById('passwordInput').value = '';
            document.getElementById('passwordInput').focus();
        }

        function closePasswordScreen() {
            document.getElementById('passwordScreen').style.display = 'none';
        }

        function checkPassword() {
            const password = document.getElementById('passwordInput').value;
            if (password === ADMIN_PASSWORD) {
                closePasswordScreen();
                openAdmin();
            } else {
                alert('❌ كلمة السر خاطئة!');
            }
        }

        function openAdmin() {
            document.getElementById('adminModal').classList.add('active');
        }

        function closeAdmin() {
            document.getElementById('adminModal').classList.remove('active');
        }

        let clickCount = 0;
        let clickTimer = null;

        document.getElementById('mainTitle').addEventListener('click', function() {
            clickCount++;
            clearTimeout(clickTimer);
            clickTimer = setTimeout(() => {
                clickCount = 0;
            }, 3000);
            
            if (clickCount >= 5) {
                clickCount = 0;
                showPasswordScreen();
            }
        });

        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        document.getElementById('mainCta').addEventListener('click', function(e) {
            e.preventDefault();
            window.open(MAIN_LINK, '_blank');
        });
    </script>
</body>
</html>
