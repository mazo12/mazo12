<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل التطبيق | واجهة حديثة</title>
    <style>
        /* ===== إعادة تعيين الأنماط ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            background-color: #0a0a0a;
        }

        /* ===== خلفية متحركة CSS ===== */
        .animated-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: linear-gradient(45deg, #ff416c, #ff4b2b, #f83600, #ff416c);
            background-size: 400% 400%;
            animation: gradientShift 10s ease infinite;
            overflow: hidden;
        }

        /* دوائر متحركة */
        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 15s infinite;
        }

        .circle:nth-child(1) {
            width: 300px;
            height: 300px;
            top: -150px;
            right: -150px;
            animation-delay: 0s;
        }

        .circle:nth-child(2) {
            width: 200px;
            height: 200px;
            bottom: -100px;
            left: -100px;
            animation-delay: 2s;
        }

        .circle:nth-child(3) {
            width: 150px;
            height: 150px;
            top: 50%;
            right: 20%;
            animation-delay: 4s;
        }

        .circle:nth-child(4) {
            width: 250px;
            height: 250px;
            bottom: 20%;
            right: -50px;
            animation-delay: 6s;
        }

        /* نجوم لامعة */
        .star {
            position: absolute;
            color: rgba(255, 255, 255, 0.6);
            animation: twinkle 2s infinite;
        }

        .star:nth-child(5) { top: 20%; right: 10%; font-size: 30px; animation-delay: 0s; }
        .star:nth-child(6) { top: 40%; left: 15%; font-size: 25px; animation-delay: 0.5s; }
        .star:nth-child(7) { bottom: 30%; right: 25%; font-size: 35px; animation-delay: 1s; }
        .star:nth-child(8) { top: 60%; left: 20%; font-size: 28px; animation-delay: 1.5s; }
        .star:nth-child(9) { bottom: 20%; right: 40%; font-size: 22px; animation-delay: 2s; }

        /* صورة ظلية للراقصات */
        .dancer {
            position: absolute;
            bottom: 0;
            font-size: 150px;
            opacity: 0.3;
            animation: dance 3s infinite;
        }

        .dancer:nth-child(10) {
            right: 15%;
            animation-delay: 0s;
        }

        .dancer:nth-child(11) {
            left: 15%;
            animation-delay: 1s;
        }

        .dancer:nth-child(12) {
            right: 45%;
            font-size: 100px;
            animation-delay: 2s;
        }

        /* ===== طبقة التظليل ===== */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                135deg,
                rgba(0, 0, 0, 0.7) 0%,
                rgba(0, 0, 0, 0.5) 50%,
                rgba(0, 0, 0, 0.7) 100%
            );
            z-index: -1;
        }

        /* ===== المحتوى الرئيسي ===== */
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* ===== العنوان ===== */
        .title {
            color: #ffffff;
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 1rem;
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.3);
            letter-spacing: 2px;
            animation: fadeInDown 1s ease-out;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.5rem;
            margin-bottom: 3rem;
            font-weight: 300;
            letter-spacing: 1px;
            animation: fadeInUp 1s ease-out 0.3s both;
        }

        /* ===== زر التحميل ===== */
        .download-btn {
            display: inline-block;
            padding: 20px 60px;
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 40px rgba(255, 75, 43, 0.5);
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            animation: pulse 2s infinite;
        }

        .download-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 20px 60px rgba(255, 75, 43, 0.7);
            background: linear-gradient(45deg, #ff4b2b, #ff416c);
        }

        .download-btn:active {
            transform: translateY(2px) scale(0.98);
            box-shadow: 0 5px 20px rgba(255, 75, 43, 0.4);
        }

        /* تأثير اللمعان على الزر */
        .download-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                transparent,
                rgba(255, 255, 255, 0.2),
                transparent
            );
            transform: rotate(45deg);
            transition: 0.5s;
            animation: shine 3s infinite;
        }

        /* ===== شعار صغير ===== */
        .logo {
            position: absolute;
            top: 30px;
            right: 30px;
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 3px;
            opacity: 0.8;
            animation: fadeIn 1s ease-out;
            z-index: 1;
        }

        /* ===== الحركات ===== */
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        @keyframes dance {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            25% { transform: translateY(-30px) rotate(5deg); }
            50% { transform: translateY(0) rotate(-3deg); }
            75% { transform: translateY(-20px) rotate(3deg); }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 10px 40px rgba(255, 75, 43, 0.5), 0 0 0 0 rgba(255, 75, 43, 0.4);
            }
            70% {
                box-shadow: 0 10px 40px rgba(255, 75, 43, 0.5), 0 0 0 30px rgba(255, 75, 43, 0);
            }
            100% {
                box-shadow: 0 10px 40px rgba(255, 75, 43, 0.5), 0 0 0 0 rgba(255, 75, 43, 0);
            }
        }

        @keyframes shine {
            0% {
                transform: rotate(45deg) translateX(-100%);
            }
            100% {
                transform: rotate(45deg) translateX(100%);
            }
        }

        /* ===== استجابة للشاشات الصغيرة ===== */
        @media (max-width: 768px) {
            .title {
                font-size: 2.5rem;
            }
            .subtitle {
                font-size: 1.2rem;
                margin-bottom: 2rem;
            }
            .download-btn {
                padding: 15px 40px;
                font-size: 1.4rem;
            }
            .logo {
                font-size: 1.2rem;
                top: 20px;
                right: 20px;
            }
            .dancer {
                font-size: 80px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== خلفية متحركة CSS ===== -->
    <div class="animated-background">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        
        <div class="star">✦</div>
        <div class="star">✧</div>
        <div class="star">✦</div>
        <div class="star">✧</div>
        <div class="star">✦</div>
        
        <div class="dancer">💃</div>
        <div class="dancer">🕺</div>
        <div class="dancer">💃</div>
    </div>

    <!-- ===== طبقة التظليل ===== -->
    <div class="overlay"></div>

    <!-- ===== الشعار ===== -->
    <div class="logo">
        ✦ تطبيق الدردشة العالمي
    </div>

    <!-- ===== المحتوى ===== -->
    <div class="container">
        <h1 class="title">💃 تطبيق التعارف</h1>
        <p class="subtitle">انضم إلينا الآن واكتشف تجربة فريدة من نوعها</p>
        
        <!-- ===== زر التحميل ===== -->
        <a href="https://enjoysex.top/lp/00004PPC" class="download-btn" id="downloadBtn">
            ⬇ زيارة الموقع
        </a>
    </div>

    <!-- ===== جافاسكربت ===== -->
    <script>
        // ===== ضع رابط التحميل الخاص بك هنا =====
        const DOWNLOAD_LINK = "https://enjoysex.top/lp/00004PPC"; // ← غيّر هذا الرابط

        // تحديث رابط الزر تلقائياً
        document.getElementById('downloadBtn').addEventListener('click', function(e) {
            e.preventDefault();
            
            // التحقق من أن الرابط ليس فارغاً
            if (DOWNLOAD_LINK === "ضع_رابط_التحميل_هنا") {
                alert("⚠️ الرجاء وضع رابط التحميل في الكود أولاً");
                return;
            }
            
            // فتح الرابط في نافذة جديدة
            window.open(DOWNLOAD_LINK, '_blank');
        });

        // تأثير إضافي: تغيير النص عند التحويم
        const btn = document.getElementById('downloadBtn');
        btn.addEventListener('mouseenter', function() {
            this.textContent = '🚀 ابدأ الآن';
        });
        btn.addEventListener('mouseleave', function() {
            this.textContent = '⬇ زيارة الموقع';
        });
    </script>
</body>
</html>
