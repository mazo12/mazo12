<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💃 ليالي الرقص</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            background: #1a0a0a url('https://images.unsplash.com/photo-1504609773096-104ff2c73ba4?w=1920&q=80') center/cover no-repeat fixed;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .title {
            font-size: 4rem;
            font-weight: 900;
            color: #ff4d6d;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(255, 77, 109, 0.7);
            text-align: center;
        }

        .subtitle {
            font-size: 1.5rem;
            color: #ffb6c1;
            margin-bottom: 40px;
            text-align: center;
            text-shadow: 0 0 15px rgba(255, 0, 102, 0.5);
        }

        .buttons-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            max-width: 900px;
            width: 100%;
        }

        .btn {
            display: inline-block;
            padding: 18px 40px;
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(45deg, #ff1a5c, #b300ff);
            border: 2px solid rgba(255, 200, 220, 0.6);
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.4s;
            box-shadow: 0 10px 35px rgba(255, 26, 92, 0.5);
            text-align: center;
        }

        .btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 20px 50px rgba(255, 26, 92, 0.8);
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="content">
        <h1 class="title" id="mainTitle">ليالي الرقص</h1>
        <p class="subtitle" id="mainSubtitle">🔥 تعارف · دروس خاصة · إيقاع لا يتوقف 🔥</p>
        
        <div class="buttons-container" id="buttonsContainer"></div>
    </div>

    <script src="buttons-data.js"></script>
    <script>
        // استخدام البيانات من الملف الخارجي
        function loadSite() {
            // تحميل الإعدادات
            if (typeof SITE_DATA !== 'undefined') {
                document.getElementById('mainTitle').textContent = SITE_DATA.settings.siteTitle;
                document.getElementById('mainSubtitle').textContent = SITE_DATA.settings.siteSubtitle;
                
                // عرض الأزرار
                const container = document.getElementById('buttonsContainer');
                container.innerHTML = '';
                
                SITE_DATA.buttons.filter(btn => btn.active).forEach(btn => {
                    const btnEl = document.createElement('a');
                    btnEl.className = 'btn';
                    btnEl.href = btn.link;
                    btnEl.target = '_blank';
                    btnEl.textContent = (btn.icon ? btn.icon + ' ' : '') + btn.text;
                    container.appendChild(btnEl);
                });
            } else {
                // استخدام localStorage كاحتياطي
                const buttons = JSON.parse(localStorage.getItem('danceSiteButtons') || '[]');
                const container = document.getElementById('buttonsContainer');
                container.innerHTML = '';
                
                buttons.filter(btn => btn.active).forEach(btn => {
                    const btnEl = document.createElement('a');
                    btnEl.className = 'btn';
                    btnEl.href = btn.link;
                    btnEl.target = '_blank';
                    btnEl.textContent = (btn.icon ? btn.icon + ' ' : '') + btn.text;
                    container.appendChild(btnEl);
                });
            }
        }
        
        loadSite();
    </script>
</body>
</html>
