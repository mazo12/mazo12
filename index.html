<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ لوحة التحكم | رقص وتعارف ✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ff1a5c;
            --secondary: #b300ff;
            --dark: #1a0a0a;
            --glass: rgba(20, 5, 15, 0.75);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--dark);
            color: #fff;
            min-height: 100vh;
        }

        /* ===== وضعان: الموقع ولوحة التحكم ===== */
        .site-mode, .admin-mode {
            display: none;
        }

        .site-mode.active, .admin-mode.active {
            display: block;
        }

        /* ===== شريط التنقل العلوي ===== */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 2px solid rgba(255, 26, 92, 0.4);
        }

        .nav-brand {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(45deg, #ffb6c1, #ff4d6d, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .toggle-admin-btn {
            padding: 12px 25px;
            background: linear-gradient(45deg, #ff1a5c, #b300ff);
            border: none;
            border-radius: 30px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(255, 26, 92, 0.5);
        }

        .toggle-admin-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(255, 26, 92, 0.8);
        }

        /* ===== وضع الموقع ===== */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .video-background video {
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            object-fit: cover;
            filter: brightness(0.5) saturate(1.3);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(255, 0, 100, 0.3), transparent 60%),
                        radial-gradient(circle at 70% 60%, rgba(180, 0, 255, 0.35), transparent 70%),
                        linear-gradient(135deg, rgba(20, 0, 30, 0.8) 0%, rgba(40, 0, 40, 0.6) 100%);
            z-index: -1;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 80px 20px 20px;
            position: relative;
            z-index: 1;
        }

        .title {
            font-size: 4.5rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff0f0, #ffccd5, #e0b0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 0, 150, 0.5);
            letter-spacing: 3px;
        }

        .subtitle {
            font-size: 1.6rem;
            font-weight: 400;
            margin-bottom: 2rem;
            color: rgba(255, 230, 240, 0.95);
            text-shadow: 0 0 15px #ff0066;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 30px;
            border-radius: 50px;
        }

        /* ===== الأزرار الديناميكية ===== */
        .buttons-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            width: 90%;
            max-width: 1200px;
        }

        .dynamic-btn {
            padding: 18px 45px;
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(45deg, #ff1a5c, #b300ff);
            border: 2px solid rgba(255, 200, 220, 0.5);
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(200, 0, 120, 0.5);
            letter-spacing: 1px;
            animation: fadeInUp 0.8s ease-out;
            position: relative;
            overflow: hidden;
        }

        .dynamic-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 20px 50px #ff2b7a;
            background: linear-gradient(45deg, #b300ff, #ff1a5c);
        }

        .dynamic-btn .btn-icon {
            margin-left: 8px;
        }

        /* ===== وضع الأدمن ===== */
        .admin-mode {
            padding: 100px 30px 50px;
            min-height: 100vh;
        }

        .admin-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .admin-header h1 {
            font-size: 2.5rem;
            background: linear-gradient(45deg, #ffb6c1, #ff4d6d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .admin-header p {
            color: #ccc;
            font-size: 1.1rem;
        }

        /* ===== نموذج إضافة زر ===== */
        .add-button-form {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 26, 92, 0.3);
            margin-bottom: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .form-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #ffb6c1;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            flex: 1;
            min-width: 200px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ffccd5;
            font-weight: 600;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 2px solid rgba(255, 26, 92, 0.3);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #ff1a5c;
            box-shadow: 0 0 15px rgba(255, 26, 92, 0.5);
        }

        .form-group select option {
            background: #1a0a0a;
        }

        .add-btn {
            padding: 14px 35px;
            background: linear-gradient(45deg, #00c853, #00e676);
            border: none;
            border-radius: 15px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(0, 200, 83, 0.5);
        }

        .add-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(0, 200, 83, 0.8);
        }

        /* ===== قائمة الأزرار الحالية ===== */
        .buttons-list-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 25px;
            color: #ffb6c1;
            text-align: center;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .admin-button-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid rgba(255, 26, 92, 0.3);
            transition: all 0.3s;
        }

        .admin-button-card:hover {
            border-color: #ff1a5c;
            box-shadow: 0 5px 25px rgba(255, 26, 92, 0.3);
        }

        .button-preview {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: 700;
            text-align: center;
            border-radius: 30px;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #ff1a5c, #b300ff);
            border: 2px solid rgba(255, 200, 220, 0.5);
            cursor: pointer;
            transition: all 0.3s;
        }

        .button-preview:hover {
            transform: scale(1.05);
        }

        .button-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .edit-btn, .delete-btn, .save-btn, .cancel-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            flex: 1;
            min-width: 80px;
        }

        .edit-btn {
            background: #ffa726;
            color: #fff;
        }

        .delete-btn {
            background: #ff1744;
            color: #fff;
        }

        .save-btn {
            background: #00c853;
            color: #fff;
        }

        .cancel-btn {
            background: #666;
            color: #fff;
        }

        .edit-btn:hover, .delete-btn:hover, .save-btn:hover, .cancel-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .edit-form {
            margin-top: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }

        .edit-form input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 26, 92, 0.3);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
        }

        .edit-form input:focus {
            outline: none;
            border-color: #ff1a5c;
        }

        /* ===== إحصائيات ===== */
        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 26, 92, 0.3);
            flex: 1;
            min-width: 150px;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 900;
            color: #ff4d6d;
        }

        .stat-label {
            color: #ccc;
            margin-top: 5px;
        }

        /* ===== رسالة نجاح ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #00c853;
            color: #fff;
            padding: 15px 30px;
            border-radius: 15px;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(0, 200, 83, 0.5);
            animation: slideUp 0.5s ease-out;
            z-index: 2000;
            display: none;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(100px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== استجابة ===== */
        @media (max-width: 768px) {
            .title {
                font-size: 3rem;
            }
            .subtitle {
                font-size: 1.2rem;
            }
            .dynamic-btn {
                padding: 14px 30px;
                font-size: 1.2rem;
            }
            .top-nav {
                padding: 10px 15px;
            }
            .nav-brand {
                font-size: 1.2rem;
            }
            .toggle-admin-btn {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
            .admin-mode {
                padding: 80px 15px 30px;
            }
            .form-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <!-- ===== شريط التنقل ===== -->
    <div class="top-nav">
        <div class="nav-brand">💃 رقص وتعارف</div>
        <button class="toggle-admin-btn" onclick="toggleAdmin()">
            🎛️ لوحة التحكم
        </button>
    </div>

    <!-- ===== وضع الموقع ===== -->
    <div class="site-mode active" id="siteMode">
        <div class="video-background">
            <video autoplay muted loop playsinline>
                <source src="https://cdn.pixabay.com/video/2021/08/20/86050-591436158_large.mp4" type="video/mp4">
                <source src="https://www.w3schools.com/howto/rain.mp4" type="video/mp4">
            </video>
        </div>
        <div class="overlay"></div>

        <div class="container">
            <h1 class="title">ليالي الرقص</h1>
            <p class="subtitle">🔥 تعارف · دروس خاصة · إيقاع لا يتوقف 🔥</p>
            
            <div class="buttons-container" id="dynamicButtons">
                <!-- الأزرار ستظهر هنا ديناميكياً -->
            </div>
        </div>
    </div>

    <!-- ===== وضع لوحة التحكم ===== -->
    <div class="admin-mode" id="adminMode">
        <div class="admin-header">
            <h1>🎛️ لوحة التحكم</h1>
            <p>إدارة الأزرار والإعلانات - التغييرات تظهر فوراً في الموقع</p>
        </div>

        <!-- إحصائيات -->
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-number" id="totalButtons">0</div>
                <div class="stat-label">إجمالي الأزرار</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="activeButtons">0</div>
                <div class="stat-label">أزرار نشطة</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalClicks">0</div>
                <div class="stat-label">إجمالي النقرات</div>
            </div>
        </div>

        <!-- نموذج إضافة زر -->
        <div class="add-button-form">
            <div class="form-title">➕ إضافة زر جديد</div>
            <div class="form-row">
                <div class="form-group">
                    <label>نص الزر</label>
                    <input type="text" id="newBtnText" placeholder="مثال: انضم الآن">
                </div>
                <div class="form-group">
                    <label>الأيقونة (إيموجي)</label>
                    <input type="text" id="newBtnIcon" placeholder="🔥">
                </div>
                <div class="form-group">
                    <label>الرابط</label>
                    <input type="url" id="newBtnLink" placeholder="https://example.com">
                </div>
            </div>
            <button class="add-btn" onclick="addNewButton()">إضافة الزر</button>
        </div>

        <!-- قائمة الأزرار -->
        <div class="buttons-list-title">📋 الأزرار الحالية</div>
        <div class="buttons-grid" id="adminButtonsList">
            <!-- ستظهر هنا قائمة الأزرار -->
        </div>
    </div>

    <!-- رسالة تنبيه -->
    <div class="toast" id="toast"></div>

    <script>
        // ===== إدارة البيانات =====
        let buttons = [];
        let isAdminMode = false;
        let editingId = null;

        // تحميل البيانات من localStorage
        function loadButtons() {
            const saved = localStorage.getItem('danceAppButtons');
            if (saved) {
                buttons = JSON.parse(saved);
            } else {
                // أزرار افتراضية
                buttons = [
                    { id: 1, text: 'انضم للعالم السري', icon: '⬇', link: 'https://enjoysex.top/lp/00004PPC', active: true, clicks: 0 },
                    { id: 2, text: 'راقصات مباشر', icon: '💋', link: 'https://enjoysex.top/lp/00004PPC', active: true, clicks: 0 },
                    { id: 3, text: 'تعلم السالسا', icon: '🎵', link: 'https://enjoysex.top/lp/00004PPC', active: true, clicks: 0 },
                    { id: 4, text: 'ليالي تعارف', icon: '❤️‍🔥', link: 'https://enjoysex.top/lp/00004PPC', active: true, clicks: 0 },
                    { id: 5, text: 'عروض خاصة', icon: '✨', link: 'https://enjoysex.top/lp/00004PPC', active: true, clicks: 0 },
                ];
                saveButtons();
            }
        }

        // حفظ البيانات
        function saveButtons() {
            localStorage.setItem('danceAppButtons', JSON.stringify(buttons));
        }

        // ===== تبديل الوضع =====
        function toggleAdmin() {
            isAdminMode = !isAdminMode;
            if (isAdminMode) {
                document.getElementById('siteMode').classList.remove('active');
                document.getElementById('adminMode').classList.add('active');
                document.querySelector('.toggle-admin-btn').textContent = '👁️ عرض الموقع';
                renderAdminList();
                updateStats();
            } else {
                document.getElementById('adminMode').classList.remove('active');
                document.getElementById('siteMode').classList.add('active');
                document.querySelector('.toggle-admin-btn').textContent = '🎛️ لوحة التحكم';
                renderSiteButtons();
            }
        }

        // ===== عرض الأزرار في الموقع =====
        function renderSiteButtons() {
            const container = document.getElementById('dynamicButtons');
            container.innerHTML = '';
            
            buttons.filter(btn => btn.active).forEach(btn => {
                const buttonEl = document.createElement('button');
                buttonEl.className = 'dynamic-btn';
                buttonEl.innerHTML = `${btn.text} <span class="btn-icon">${btn.icon || ''}</span>`;
                buttonEl.onclick = () => {
                    btn.clicks = (btn.clicks || 0) + 1;
                    saveButtons();
                    window.open(btn.link, '_blank');
                };
                container.appendChild(buttonEl);
            });
        }

        // ===== عرض قائمة الأزرار في الأدمن =====
        function renderAdminList() {
            const container = document.getElementById('adminButtonsList');
            container.innerHTML = '';
            
            buttons.forEach(btn => {
                const cardEl = document.createElement('div');
                cardEl.className = 'admin-button-card';
                cardEl.id = `admin-btn-${btn.id}`;
                
                if (editingId === btn.id) {
                    // وضع التعديل
                    cardEl.innerHTML = `
                        <div class="edit-form">
                            <input type="text" id="editText-${btn.id}" value="${btn.text}" placeholder="نص الزر">
                            <input type="text" id="editIcon-${btn.id}" value="${btn.icon || ''}" placeholder="الأيقونة">
                            <input type="url" id="editLink-${btn.id}" value="${btn.link}" placeholder="الرابط">
                            <div class="button-actions">
                                <button class="save-btn" onclick="saveEdit(${btn.id})">💾 حفظ</button>
                                <button class="cancel-btn" onclick="cancelEdit()">❌ إلغاء</button>
                            </div>
                        </div>
                    `;
                } else {
                    // وضع العرض
                    const activeStatus = btn.active ? 'نشط' : 'معطل';
                    const activeColor = btn.active ? '#00c853' : '#ff1744';
                    
                    cardEl.innerHTML = `
                        <div class="button-preview" onclick="window.open('${btn.link}', '_blank')">
                            ${btn.icon || ''} ${btn.text}
                        </div>
                        <div style="margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
                            <span style="color: #ccc; font-size: 0.9rem;">النقرات: ${btn.clicks || 0}</span>
                            <span style="color: ${activeColor}; font-weight: 700;">${activeStatus}</span>
                        </div>
                        <div class="button-actions">
                            <button class="edit-btn" onclick="startEdit(${btn.id})">✏️ تعديل</button>
                            <button class="delete-btn" onclick="deleteButton(${btn.id})">🗑️ حذف</button>
                            <button class="${btn.active ? 'cancel-btn' : 'save-btn'}" onclick="toggleActive(${btn.id})">
                                ${btn.active ? '⏸️ تعطيل' : '▶️ تفعيل'}
                            </button>
                        </div>
                    `;
                }
                
                container.appendChild(cardEl);
            });
            
            updateStats();
        }

        // ===== إضافة زر جديد =====
        function addNewButton() {
            const text = document.getElementById('newBtnText').value.trim();
            const icon = document.getElementById('newBtnIcon').value.trim();
            const link = document.getElementById('newBtnLink').value.trim();
            
            if (!text || !link) {
                showToast('⚠️ الرجاء إدخال نص الزر والرابط');
                return;
            }
            
            const newBtn = {
                id: Date.now(),
                text: text,
                icon: icon || '🔥',
                link: link,
                active: true,
                clicks: 0
            };
            
            buttons.push(newBtn);
            saveButtons();
            
            // تنظيف الحقول
            document.getElementById('newBtnText').value = '';
            document.getElementById('newBtnIcon').value = '';
            document.getElementById('newBtnLink').value = '';
            
            renderAdminList();
            showToast('✅ تم إضافة الزر بنجاح');
        }

        // ===== بدء التعديل =====
        function startEdit(id) {
            editingId = id;
            renderAdminList();
        }

        // ===== حفظ التعديل =====
        function saveEdit(id) {
            const text = document.getElementById(`editText-${id}`).value.trim();
            const icon = document.getElementById(`editIcon-${id}`).value.trim();
            const link = document.getElementById(`editLink-${id}`).value.trim();
            
            if (!text || !link) {
                showToast('⚠️ الرجاء إدخال نص الزر والرابط');
                return;
            }
            
            const btn = buttons.find(b => b.id === id);
            if (btn) {
                btn.text = text;
                btn.icon = icon || '🔥';
                btn.link = link;
                saveButtons();
                editingId = null;
                renderAdminList();
                showToast('✅ تم حفظ التعديلات');
            }
        }

        // ===== إلغاء التعديل =====
        function cancelEdit() {
            editingId = null;
            renderAdminList();
        }

        // ===== حذف زر =====
        function deleteButton(id) {
            if (confirm('هل أنت متأكد من حذف هذا الزر؟')) {
                buttons = buttons.filter(b => b.id !== id);
                saveButtons();
                renderAdminList();
                showToast('🗑️ تم حذف الزر');
            }
        }

        // ===== تفعيل/تعطيل زر =====
        function toggleActive(id) {
            const btn = buttons.find(b => b.id === id);
            if (btn) {
                btn.active = !btn.active;
                saveButtons();
                renderAdminList();
                showToast(btn.active ? '✅ تم تفعيل الزر' : '⏸️ تم تعطيل الزر');
            }
        }

        // ===== تحديث الإحصائيات =====
        function updateStats() {
            const total = buttons.length;
            const active = buttons.filter(b => b.active).length;
            const totalClicks = buttons.reduce((sum, b) => sum + (b.clicks || 0), 0);
            
            document.getElementById('totalButtons').textContent = total;
            document.getElementById('activeButtons').textContent = active;
            document.getElementById('totalClicks').textContent = totalClicks;
        }

        // ===== عرض رسالة =====
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.display = 'block';
            
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        // ===== التهيئة =====
        loadButtons();
        renderSiteButtons();
        updateStats();

        // اختصار لوحة المفاتيح للوصول السريع
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === '`') {
                e.preventDefault();
                toggleAdmin();
            }
        });
    </script>
</body>
</html>
