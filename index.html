<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💃 ليالي الرقص | تعارف وتعلم</title>
    <style>
        :root {
            --primary: #ff1a5c;
            --secondary: #b300ff;
            --accent: #ff6b9d;
            --dark: #0a0000;
            --glass: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 26, 92, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            background: var(--dark);
            color: #fff;
            overflow-x: hidden;
        }

        /* ===== الخلفية ===== */
        .background-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
        }

        .background-wrapper img,
        .background-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, 
                rgba(10, 0, 20, 0.85) 0%, 
                rgba(20, 0, 40, 0.7) 50%, 
                rgba(30, 0, 30, 0.85) 100%);
            backdrop-filter: blur(2px);
        }

        /* ===== المحتوى ===== */
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            text-align: center;
        }

        .main-title {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 900;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff 0%, #ffccd5 30%, #e0b0ff 60%, #ff6b9d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(255, 0, 100, 0.6);
            letter-spacing: 4px;
            animation: glowPulse 3s ease-in-out infinite;
        }

        .subtitle {
            font-size: clamp(1.2rem, 3vw, 2rem);
            font-weight: 500;
            margin-bottom: 3rem;
            color: rgba(255, 230, 240, 0.95);
            text-shadow: 0 0 20px rgba(255, 0, 102, 0.8);
            background: rgba(0, 0, 0, 0.4);
            padding: 15px 40px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
        }

        /* ===== الأزرار ===== */
        .buttons-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            max-width: 1000px;
            margin: 20px 0;
        }

        .action-btn {
            position: relative;
            padding: 20px 50px;
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, rgba(255, 26, 92, 0.9), rgba(179, 0, 255, 0.9));
            border: 2px solid rgba(255, 200, 220, 0.4);
            border-radius: 60px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 40px rgba(200, 0, 120, 0.5);
            letter-spacing: 2px;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 15px;
            animation: fadeInUp 0.8s ease-out;
        }

        .action-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s;
        }

        .action-btn:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 25px 60px rgba(255, 43, 122, 0.8), 0 0 50px rgba(179, 0, 255, 0.5);
            border-color: #fff;
        }

        .action-btn:hover::before {
            left: 100%;
        }

        .action-btn:active {
            transform: translateY(-2px) scale(0.98);
        }

        .btn-icon {
            font-size: 1.8rem;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));
        }

        /* ===== حركات ===== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes glowPulse {
            0%, 100% {
                text-shadow: 0 0 40px rgba(255, 0, 100, 0.6);
            }
            50% {
                text-shadow: 0 0 70px rgba(255, 0, 100, 0.9), 0 0 120px rgba(179, 0, 255, 0.5);
            }
        }

        /* ===== تأثير الجزيئات ===== */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(1);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            .action-btn {
                padding: 15px 35px;
                font-size: 1.2rem;
                gap: 10px;
            }
            .btn-icon {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- الخلفية -->
    <div class="background-wrapper" id="backgroundWrapper">
        <!-- ستُملأ تلقائياً من localStorage -->
    </div>
    <div class="background-overlay"></div>

    <!-- الجزيئات -->
    <div class="particles" id="particles"></div>

    <!-- المحتوى -->
    <div class="container">
        <h1 class="main-title" id="siteTitle">ليالي الرقص</h1>
        <p class="subtitle" id="siteSubtitle">🔥 تعارف · دروس خاصة · إيقاع لا يتوقف 🔥</p>
        
        <div class="buttons-grid" id="buttonsGrid">
            <!-- الأزرار ستظهر هنا -->
        </div>
    </div>

    <script>
        // ===== تحميل الإعدادات =====
        function loadSettings() {
            const settings = JSON.parse(localStorage.getItem('siteSettings') || '{}');
            
            // تطبيق الخلفية
            const bgWrapper = document.getElementById('backgroundWrapper');
            if (settings.backgroundType === 'video' && settings.backgroundUrl) {
                bgWrapper.innerHTML = `<video autoplay muted loop playsinline>
                    <source src="${settings.backgroundUrl}" type="video/mp4">
                </video>`;
            } else if (settings.backgroundType === 'image' && settings.backgroundUrl) {
                bgWrapper.innerHTML = `<img src="${settings.backgroundUrl}" alt="خلفية">`;
            } else {
                // خلفية افتراضية
                bgWrapper.innerHTML = `<img src="https://images.unsplash.com/photo-1504609773096-104ff2c73ba4?w=1920&q=80" alt="خلفية رقص">`;
            }
            
            // تطبيق العنوان
            if (settings.siteTitle) {
                document.getElementById('siteTitle').textContent = settings.siteTitle;
            }
            
            // تطبيق العنوان الفرعي
            if (settings.siteSubtitle) {
                document.getElementById('siteSubtitle').textContent = settings.siteSubtitle;
            }
        }

        // ===== تحميل الأزرار =====
        function loadButtons() {
            const buttons = JSON.parse(localStorage.getItem('siteButtons') || '[]');
            const grid = document.getElementById('buttonsGrid');
            grid.innerHTML = '';
            
            buttons.filter(btn => btn.active !== false).forEach(btn => {
                const btnEl = document.createElement('button');
                btnEl.className = 'action-btn';
                btnEl.innerHTML = `${btn.icon ? `<span class="btn-icon">${btn.icon}</span>` : ''} ${btn.text}`;
                btnEl.style.animationDelay = `${Math.random() * 0.5}s`;
                btnEl.onclick = () => {
                    // تسجيل النقرة
                    const allButtons = JSON.parse(localStorage.getItem('siteButtons') || '[]');
                    const found = allButtons.find(b => b.id === btn.id);
                    if (found) {
                        found.clicks = (found.clicks || 0) + 1;
                        localStorage.setItem('siteButtons', JSON.stringify(allButtons));
                    }
                    window.open(btn.link, '_blank');
                };
                grid.appendChild(btnEl);
            });
        }

        // ===== إنشاء جزيئات =====
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.width = `${Math.random() * 6 + 2}px`;
                particle.style.height = particle.style.width;
                particle.style.animationDuration = `${Math.random() * 10 + 5}s`;
                particle.style.animationDelay = `${Math.random() * 10}s`;
                container.appendChild(particle);
            }
        }

        // ===== التهيئة =====
        loadSettings();
        loadButtons();
        createParticles();

        // الاستماع للتغييرات من localStorage
        window.addEventListener('storage', (e) => {
            if (e.key === 'siteButtons') {
                loadButtons();
            }
            if (e.key === 'siteSettings') {
                loadSettings();
            }
        });
    </script>
</body>
</html>
